# Optional: lets Render create the service for you (New > Blueprint). The manual steps in README.md work just as well.
services:
  - type: web
    name: elevate-quote-desk
    runtime: node
    region: singapore
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: elevate_quote_desk
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Bala
      - key: MAX_STAFF
        value: "1"
