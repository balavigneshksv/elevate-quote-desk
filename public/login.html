<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Sign in · Elevate Quote Desk</title>
<link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600&family=Source+Serif+4:wght@600&display=swap">
<style>
:root{color-scheme:light;--navy:#121c45;--accent:#2b6a9a;--ink:#14213d;--muted:#5b6678;--line:#cfd6e0;--bad:#9a3129;--bad-bg:#f8e3e0;
  --sans:'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--serif:'Source Serif 4',Georgia,'Times New Roman',serif}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font:400 16px/1.5 var(--sans);color:var(--ink);background:linear-gradient(160deg,#0e1637 0%,#121c45 55%,#1b2d63 100%);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px;-webkit-font-smoothing:antialiased}
.card{width:100%;max-width:400px;background:#fff;border-radius:10px;padding:32px 28px 26px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.logo{display:block;width:84px;height:84px;margin:0 auto 14px;border-radius:50%;object-fit:cover}
h1{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.15;text-align:center;margin:0}
.sub{text-align:center;color:var(--muted);font-size:14px;margin:6px 0 22px}
label{display:block;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:14px 0 5px;font-weight:500}
input{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);min-height:44px}
input:focus-visible{outline:2px solid var(--accent);outline-offset:1px;border-color:var(--accent)}
.pw{position:relative}
.pw input{padding-right:70px}
.pw button{position:absolute;right:4px;top:4px;bottom:4px;border:0;background:none;color:var(--accent);font:inherit;font-size:14px;cursor:pointer;padding:0 10px;border-radius:5px}
.pw button:hover{background:#eef4fa}
.go{width:100%;margin-top:20px;min-height:46px;border:0;border-radius:6px;background:var(--navy);color:#fff;font:inherit;font-weight:600;font-size:16px;cursor:pointer}
.go:hover{background:#1c2c66}
.go[disabled]{opacity:.6;cursor:wait}
.err{display:none;margin-top:14px;padding:10px 12px;border-radius:6px;background:var(--bad-bg);color:var(--bad);font-size:14px}
.err.on{display:block}
.foot{margin-top:18px;text-align:center;font-size:12.5px;color:var(--muted)}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="/logo.png" alt="Elevate Interiors">
  <h1>Elevate Quote Desk</h1>
  <p class="sub">Sign in to continue</p>
  <form id="f" autocomplete="on" novalidate>
    <label for="u">Username</label>
    <input id="u" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    <label for="p">Password</label>
    <div class="pw"><input id="p" name="password" type="password" autocomplete="current-password" required><button type="button" id="t" aria-label="Show password">Show</button></div>
    <div class="err" id="e" role="alert"></div>
    <button class="go" id="g" type="submit">Sign in</button>
  </form>
  <p class="foot">Forgot your password? Ask the admin to reset it.</p>
</main>
<script>
(function () {
  var f = document.getElementById('f'), u = document.getElementById('u'), p = document.getElementById('p'),
      e = document.getElementById('e'), g = document.getElementById('g'), t = document.getElementById('t');
  t.addEventListener('click', function () {
    var show = p.type === 'password'; p.type = show ? 'text' : 'password';
    t.textContent = show ? 'Hide' : 'Show'; t.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });
  function fail(m) { e.textContent = m; e.classList.add('on'); g.disabled = false; g.textContent = 'Sign in'; }
  f.addEventListener('submit', function (ev) {
    ev.preventDefault(); e.classList.remove('on');
    if (!u.value.trim() || !p.value) { fail('Enter your username and password.'); return; }
    g.disabled = true; g.textContent = 'Signing in…';
    fetch('/api/login', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' }, body: JSON.stringify({ username: u.value, password: p.value }) })
      .then(function (r) { return r.json().catch(function () { return {}; }).then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (r) { if (r.ok) { location.replace('/'); } else { fail(r.j.error || 'Could not sign in. Try again.'); } })
      .catch(function () { fail('Could not reach the server. Check your internet and try again.'); });
  });
})();
</script>
</body>
</html>
